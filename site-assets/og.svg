<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="72%">
      <stop offset="0%" stop-color="#7dd3a0" stop-opacity=".26"/>
      <stop offset="55%" stop-color="#7dd3a0" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#7dd3a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#1e1e25" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1200" height="630" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1200" height="630" fill="#08080a"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(88,96)">
    <rect x="0" y="0" width="60" height="60" rx="15" fill="none" stroke="#7dd3a0" stroke-width="3" opacity=".42"/>
    <path d="M16 31 L26 41 L45 21" fill="none" stroke="#7dd3a0" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="168" y="140" font-size="30" font-weight="600" fill="#f2f2f4" letter-spacing="-.5">prod<tspan fill="#7dd3a0">check</tspan></text>

  <text x="88" y="272" font-size="62" font-weight="650" fill="#f2f2f4" letter-spacing="-2.2">The checklist you wish someone</text>
  <text x="88" y="344" font-size="62" font-weight="650" fill="#f2f2f4" letter-spacing="-2.2">had given you before launch.</text>

  <text x="88" y="404" font-size="26" fill="#a3a3ad">{{total}} things to check before you ship — security, speed, scale,</text>
  <text x="88" y="440" font-size="26" fill="#a3a3ad">being findable, and what to do when it breaks anyway.</text>

  <g transform="translate(88,494)">
    <rect x="0" y="0" width="1024" height="1" fill="#1e1e25"/>
    <text x="0" y="52" font-size="34" font-weight="650" fill="#f2f2f4">{{total}}</text>
    <text x="0" y="80" font-size="16" fill="#6e6e79" letter-spacing="1.4">ITEMS</text>
    <text x="230" y="52" font-size="34" font-weight="650" fill="#f2f2f4">{{domains}}</text>
    <text x="230" y="80" font-size="16" fill="#6e6e79" letter-spacing="1.4">DOMAINS</text>
    <text x="450" y="52" font-size="34" font-weight="650" fill="#f2f2f4">{{gate}}</text>
    <text x="450" y="80" font-size="16" fill="#6e6e79" letter-spacing="1.4">BLOCKERS</text>
    <text x="700" y="52" font-size="34" font-weight="650" fill="#7dd3a0">Free</text>
    <text x="700" y="80" font-size="16" fill="#6e6e79" letter-spacing="1.4">OPEN SOURCE</text>
    <text x="0" y="122" font-size="17" fill="#6e6e79">github.com/FarzamHabibi/pre-production-checklist</text>
  </g>
</svg>