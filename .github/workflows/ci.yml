name: ci

# This repository tells you to pin actions by commit SHA, restrict workflow
# permissions to read-only, and avoid pull_request_target. It follows its own advice.
# See checklists/core/15-ci-cd-and-supply-chain.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - name: Full verification (the same gate run before every push)
        run: ./scripts/verify.sh

      - name: GitHub sidebar description matches the README
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="$(cat .github/description.txt)"
          have="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.description // ""')"
          if [ "$want" != "$have" ]; then
            echo "::error::The repository description has drifted from the README."
            echo "  sidebar: $have"
            echo "  should be: $want"
            echo ""
            echo "Fix with:"
            echo "  gh repo edit --description \"$want\""
            exit 1
          fi
          echo "sidebar in sync"

